; RP2040 + wiicam (SEN0158) build.
; Run tools/patch_openfire.py --board rp2040 --fetch once, then:
;   pio run -c platformio_rp2040.ini -t upload
; Separate ini because src_dir is global in PlatformIO and the ESP32 build
; uses it. Builds on the earlephilhower arduino-pico core.
[platformio]
default_envs = combined_rp2040_wiicam
src_dir = OpenFIRE-Firmware-RP2040/OpenFIREmain

[env:combined_rp2040_wiicam]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
extra_scripts = pre:tools/check_setup.py
board_build.core = earlephilhower
board_build.filesystem_size = 512k
monitor_speed = 115200
; UF2 upload via tools/upload_uf2.py: reboots the gun to BOOTSEL, WAITS for
; the RPI-RP2 drive to mount, then copies the UF2. No picotool, no driver.
upload_protocol = custom
upload_command = python tools/upload_uf2.py "$BUILD_DIR/firmware.uf2" $UPLOAD_PORT
lib_extra_dirs =
    OpenFIRE-Firmware-RP2040/libraries
    lib
; ESP32-only libraries, plus the core's Bluetooth stack (its guarded
; includes would still be followed by the LDF).
lib_ignore = esp32-camera-ov2640, OV2640Capture, DFRobotIRPositionEx_OV2640, HID_Bluetooth
build_flags =
    -D USE_TINYUSB
    -D USE_AIM_PIPELINE
    -D LIGHTGUN_RECOIL_FX
    -D AIM_NVS_SHIM
    -D AIM_BOARD='"rp2040-wiicam"'
    -O2
; enable float printf in newlib-nano (%f otherwise prints nothing)
    -Wl,-u,_printf_float
lib_ldf_mode = chain

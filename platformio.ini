; PlatformIO project for the OV2640 lightgun overlay.
; Run tools/patch_openfire.py once before the first build.

; Builds OpenFIRE's own sources with this overlay's libraries layered on top.
; src_dir points into the OpenFIRE checkout you download separately; the board
; definition ships here, so it resolves before that checkout exists.
[platformio]
default_envs = combined_s3_freenove
src_dir = OpenFIRE-Firmware-ESP32/lightgun/src
boards_dir = boards

; Shared build flags. LIGHTGUN_DIAG=0 is the shipping build; the diag env sets 1.
[common]
base_flags =
    -D PATCH_CAM_TASK_CORE1
    -D GUN
    -D USE_TINYUSB
    -D CUSTOM_NEOPIXEL
    -D FOURPIN_LED
    -D NEOPIXEL_PIN=48
    -D DUAL_CORE
    -D MAMEHOOKER
    -D USES_ANALOG
    -D USE_MULTI_ONE_EURO_FILTER
    -D USE_PERSPECTIVE_ADVANCED
    -D USE_SQUARE_ADVANCED
    -D USE_AIM_PIPELINE
    -D USES_SOLENOID
    -D USES_RUMBLE
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=2
    -D CONFIG_LCD_CAM_ISR_IRAM_SAFE=1
    -O2
    -D LIGHTGUN_DIAG=0
display_flags =
    -D USES_DISPLAY
    -D USE_LOVYAN_GFX
wireless_flags =
    -D OPENFIRE_WIRELESS_ENABLE
    -D OPENFIRE_WIRELESS_DEVICE_ESPNOW
    -D OPENFIRE_AUTO_CHANNEL_ESPNOW_WIFI
    -D OPENFIRE_USE_ESPNOW_UNIFIED_PACKET

; THE BUILD YOU WANT. Freenove ESP32-S3-WROOM CAM (N8R8).
; memory_type=qio_opi is required: the stock N8R2 board definition assumes QUAD
; PSRAM and leaves the module's 8MB OCTAL PSRAM uninitialised.
[env:combined_s3_freenove]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
extra_scripts = pre:tools/check_setup.py
board = ESP32-S3-WROOM-1-DevKitC-1-N8R2
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
    OpenFIRE-Firmware-ESP32/lightgun/lib
    OpenFIRE-Firmware-ESP32/shared_lib
lib_ignore = DFRobotIRPositionEx, DFRobotIRPositionEx_Wrapper, PixArt_PAJ7025, NvsShimRP2040, WiicamAim
lib_deps =
    Adafruit TinyUSB Library = https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git#3.7.7
    Adafruit BusIO = https://github.com/adafruit/Adafruit_BusIO.git#1.17.4
    Adafruit GFX Library = https://github.com/adafruit/Adafruit-GFX-Library.git#1.12.6
    Adafruit SSD1306 = https://github.com/adafruit/Adafruit_SSD1306.git#2.5.17
    Adafruit NeoPixel = https://github.com/adafruit/Adafruit_NeoPixel.git#1.15.5
    LovyanGFX Library = https://github.com/lovyan03/LovyanGFX.git#1.2.25
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags = ${common.base_flags} ${common.display_flags} ${common.wireless_flags}
board_build.partitions = OpenFIRE-Firmware-ESP32/shared_boards/partitions/default_OF_8MB.csv
board_build.filesystem = littlefs
lib_ldf_mode = chain

; Same firmware plus verbose instrumentation. Slower; for troubleshooting only.
[env:diag]
extends = env:combined_s3_freenove
build_flags = ${common.base_flags} ${common.display_flags} ${common.wireless_flags} -D LIGHTGUN_DIAG=1
build_unflags = -DARDUINO_USB_MODE=1 -D LIGHTGUN_DIAG=0


name: pical

# Two jobs. `smoke` proves the packaging still produces a file. `image` builds
# the bootable USB/SD image: on a tag it is attached to the release, otherwise
# it is uploaded as an artifact so a build can be tested without cutting a
# release. The host test suite is not in the repository; it runs locally before
# every delivery.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'pical/**'
      - 'tools/aim_calib.py'
      - 'tools/aim_fit.py'
      - '.github/workflows/pical-image.yml'
  workflow_dispatch:

jobs:
  # Packaging faults that still produce a file are caught here in seconds,
  # without downloading a 500 MB base image.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            parted fdisk dosfstools e2fsprogs
      - name: build against a synthetic base image
        run: sudo bash pical/image/smoke.sh

  image:
    needs: [smoke]
    runs-on: ubuntu-latest
    # The release step attaches the image to the tag; new repositories give
    # GITHUB_TOKEN read-only access, which would fail that upload.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: free up disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support parted e2fsprogs xz-utils \
            rsync wget

      - name: build the image
        run: sudo -E bash pical/image/build.sh
        env:
          OUT: ${{ github.workspace }}/pical.img

      - name: name the artifact
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "file=pical-${GITHUB_REF_NAME}.img.xz" >> "$GITHUB_OUTPUT"
          else
            echo "file=pical-${GITHUB_SHA::7}.img.xz" >> "$GITHUB_OUTPUT"
          fi

      - name: rename
        run: |
          mv pical.img.xz "${{ steps.name.outputs.file }}"
          # A fixed name as well, so the rolling release below always has the
          # same download URL -- a link that changes every build is not a link.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            cp "${{ steps.name.outputs.file }}" pical-latest.img.xz
          fi

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pical-image
          path: ${{ steps.name.outputs.file }}
          retention-days: 14

      # Every push to main replaces the assets on a fixed `latest` prerelease,
      # so there is one permanent URL for the newest build. It is marked as a
      # prerelease and make_latest is off, so it never displaces a real
      # tagged version in the Releases list.
      - name: publish the rolling build
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: pical - latest build
          prerelease: true
          make_latest: 'false'
          files: pical-latest.img.xz
          body: |
            Automatic build of `main`, replaced on every push
            (${{ github.sha }}).

            Permanent download link:
            https://github.com/${{ github.repository }}/releases/download/latest/pical-latest.img.xz

            Write it to a USB stick or SD card with Raspberry Pi Imager
            (or balenaEtcher / Rufus), plug it and the gun into a Pi, power on.

      - name: attach to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.file }}
          body: |
            Lightgun calibration stick.

            Flash `${{ steps.name.outputs.file }}` to a USB stick or SD card
            with Raspberry Pi Imager (or balenaEtcher / Rufus), plug it and the
            gun into a Pi 3 / 4 / 5 / Zero 2 W, and power on. The calibration
            screen comes up on the TV by itself.

      # The Actions run page itself gets a clickable download link, so a build
      # never has to be hunted for.
      - name: print the download link
        run: |
          {
            echo "### Download"
            echo ""
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "[${{ steps.name.outputs.file }}](https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${{ steps.name.outputs.file }})"
            else
              echo "[pical-latest.img.xz](https://github.com/${{ github.repository }}/releases/download/latest/pical-latest.img.xz)"
            fi
            echo ""
            echo "compressed size: $(du -h "${{ steps.name.outputs.file }}" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
